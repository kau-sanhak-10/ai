[project]
name = "ilro-ai"
version = "0.1.0"
description = "일로 AI 판단 서버 (FastAPI)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.142.2",
    "google-genai>=2.32.0",
    "langgraph>=1.2.14",
    "openai>=3.36.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
# 배포용 라이브러리가 아니라 서버 애플리케이션이므로 패키지로 빌드하지 않는다
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
